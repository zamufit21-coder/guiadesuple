<title>¿Qué suplementos necesitas?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una columna estrecha pensada para el navegador de Instagram. Portada, test de una pregunta por pantalla y plan final. Marca @zamudiocoach: negro, amarillo, blanco. */
:root{
  --bg:#0A0A0A; --surface:#151515; --surface2:#1E1E1E; --line:#2C2C2C;
  --fg:#FFFFFF; --muted:#A6A6A6; --yellow:#FFD60A; --on-yellow:#0A0A0A; --red:#FF5C4D; --sel:#221E05; --alert-bg:#1D0E0C;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.5;font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px}
#app{max-width:540px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.08}
button{font-family:var(--f);cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.hl{background:var(--yellow);color:var(--on-yellow);padding:0 .18em;display:inline-block;transform:rotate(-2deg);border-radius:3px}
.screen{display:flex;flex-direction:column;gap:20px;padding-top:20px;animation:in .25s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}*{transition:none!important}}

/* Portada */
.banner{width:100%;aspect-ratio:4/1;max-width:100%;object-fit:cover;border-radius:16px;border:1px solid var(--line);display:block;background:#000}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{width:44px;height:44px}
.brand a{color:var(--muted);text-decoration:none;font-weight:700;font-size:14px}
.cover h1{font-size:clamp(36px,10.5vw,56px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.cover p.sub{font-size:clamp(19px,5.4vw,23px);font-weight:800;margin:-6px 0 0;color:var(--yellow);line-height:1.25;text-wrap:balance}
.cover p.lead{font-size:17px;margin:0;color:#E8E8E8}
.cover p.lead b{color:var(--fg);font-weight:800}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted);background:var(--bg)}
.cta{display:block;width:100%;background:var(--yellow);color:var(--on-yellow);border:0;border-radius:14px;padding:18px 20px;font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;text-align:center;text-decoration:none;box-shadow:0 6px 0 #B89800}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #B89800}
.ghost{display:block;width:100%;background:transparent;color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:14px 18px;font-size:15px;font-weight:700;text-align:center}
.ghost:hover{border-color:var(--yellow)}
.how{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.how div{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-size:15px}
.how i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);display:grid;place-items:center;font-weight:900;font-size:14px}

/* Test */
.bar{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;padding:8px 0}
.prog{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog div{height:100%;background:var(--yellow);border-radius:99px;transition:width .3s}
.count{font-weight:800;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.greet{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px}
.greet img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid var(--yellow);flex:none}
.greet b{display:block;font-weight:900;font-size:17px;line-height:1.2}
.greet span{font-size:13.5px;color:var(--muted)}
.secname{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--yellow)}
.q h2{font-size:clamp(25px,7.2vw,33px);font-weight:900}
.q .hint{color:var(--muted);margin:-8px 0 0;font-size:15px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:15px 18px;font-size:16px;font-weight:700;min-height:58px}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13.5px;margin-top:2px}
.opt:hover{border-color:#5a5a5a}
.opt[aria-pressed="true"]{border-color:var(--yellow);background:var(--sel)}
.opt .tick{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:900}
.multi .opt .tick{border-radius:6px}
.opt[aria-pressed="true"] .tick{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.weight{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px 16px;display:flex;flex-direction:column;gap:18px;align-items:center}
.wrow{display:flex;align-items:center;gap:18px}
.wrow button{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface2);color:var(--fg);font-size:26px;font-weight:800}
.wnum{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;min-width:3ch;text-align:center}
.wnum small{font-size:20px;color:var(--muted);font-weight:700;margin-left:4px}
input[type=range]{width:100%;accent-color:var(--yellow)}
.cta[disabled]{opacity:.35;box-shadow:none;cursor:not-allowed}

/* Resultado */
.res-head h1{font-size:clamp(30px,8.6vw,44px);font-weight:900;text-transform:uppercase}
.res-head p{margin:8px 0 0;color:var(--muted)}
.alert{border:2px solid var(--red);border-radius:14px;padding:14px 16px;font-size:15px;background:var(--alert-bg)}
.alert b{color:var(--red)}
.base{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.base h2{font-size:18px;font-weight:900;text-transform:uppercase}
.base ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.base li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.base li::before{content:"✓";color:var(--yellow);font-weight:900}
.base .foot{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec > h2{font-size:22px;font-weight:900;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec > p{margin:-4px 0 4px;color:var(--muted);font-size:14.5px}
.sw{width:14px;height:14px;border-radius:4px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.take{border:2px solid var(--yellow)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font-size:20px;font-weight:800}
.card p{margin:0;font-size:15px}
.card .for{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--yellow)}
.row{display:grid;grid-template-columns:72px 1fr;gap:10px;font-size:14.5px}
.row b{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;padding-top:3px}
.row.dose span{font-weight:800;color:var(--yellow)}
.badge{flex:none;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:99px;white-space:nowrap}
.b-A{background:var(--yellow);color:var(--on-yellow)}
.b-B{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.b-C{background:var(--surface2);color:var(--muted);border:1.5px solid var(--line)}
.b-D{background:transparent;color:var(--muted);border:1.5px dashed var(--muted)}
.b-X{background:var(--red);color:var(--on-yellow)}
.nope{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.nope div{padding:12px 16px;border-top:1px solid var(--line);font-size:14.5px}
.nope div:first-child{border-top:0}
.nope b{display:block;font-size:15.5px}
.nope span{color:var(--muted)}
.nope b.x{color:var(--red)}
.cur b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cur i{font-style:normal;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:99px;white-space:nowrap;flex:none}
.me-cta{background:var(--yellow);color:var(--on-yellow);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.me-cta .who{display:flex;gap:12px;align-items:center}
.me-cta img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--on-yellow);flex:none}
.me-cta h2{font-size:21px;font-weight:900}
.me-cta p{margin:0;font-size:15px;font-weight:600}
.me-cta a{display:block;text-align:center;background:var(--on-yellow);color:var(--yellow);text-decoration:none;font-weight:900;text-transform:uppercase;border-radius:12px;padding:15px;font-size:16px}
.legal{font-size:12.5px;color:var(--muted);line-height:1.5}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.summary span{font-size:12px;color:var(--muted);font-weight:700}
.summary div:first-child b{color:var(--yellow)}

/* Biblioteca */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.filters button{flex:none;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13.5px}
.filters button[aria-pressed="true"]{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.search{width:100%;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:600 16px var(--f)}
.refs{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
</style>
</head>

const r25=x=>Math.round(x/25)*25, r5=x=>Math.round(x/5)*5;
function evaluate(a){
  const H=(k,v)=>Array.isArray(a[k])&&a[k].includes(v);
  const out=[], seen={};
  const add=(id,s,why,dose,tag)=>{ if(seen[id]) return; seen[id]=1; out.push({id,s,why,dose,tag}); };
  const g=a.goal, w=a.w, minor=a.age==="menor", mayor=a.age==="mayor";
  const preg=H("period","embarazo"), meno=H("period","meno"), tr=trains(a);
  const renal=H("health","renal"), liver=H("health","higado"), hta=H("health","hta"), med=H("health","med"), thy=H("health","tiroides");

function alertsFor(a){

  if(a.age==="menor") L.push(`<b>Tienes menos de 18.</b> Lo primero es comer bien, dormir y entrenar con alguien que sepa. Nada para rendir más sin que lo vea un médico.`);
  if(H("period","embarazo")) L.push(`<b>Embarazo o lactancia.</b> Antes de tomar cualquier cosa, pregunta a tu ginecólogo o matrona.`);
  if(H("period","irregular")||H("periodMenor","irregular")) L.push(`<b>Regla irregular o retirada.</b> Si entrenas mucho y comes poco, el cuerpo «apaga» la regla para ahorrar energía. Es una señal de alarma para tus huesos y tus hormonas: come más y ve al ginecólogo. Ningún suplemento lo arregla.`);
  if(H("period","dolor")||H("periodMenor","dolor")) L.push(`<b>Regla muy dolorosa.</b> Si el dolor te impide hacer vida normal, consulta al ginecólogo: puede ser endometriosis.`);
  if(H("health","med")) L.push(`<b>Tomas medicación.</b> Enséñale esta lista a tu médico o farmacéutico antes de tomar nada. Algunos suplementos interactúan con medicamentos.`);
  if(H("health","renal")||H("health","higado")) L.push(`<b>Problema de riñón o hígado.</b> Cualquier suplemento, primero con tu médico.`);
  if(H("health","tiroides")) L.push(`<b>Tiroides.</b> Separa 4 horas el calcio, el hierro y la soja de tu medicación. Nada de yodo, algas ni ashwagandha sin tu endocrino. La biotina altera tus analíticas.`);
  if(H("health","diabetes")) L.push(`<b>Diabetes.</b> Si usas insulina o pastillas, la cafeína y los hidratos durante el ejercicio cambian tu glucosa. Ajusta con tu endocrino.`);
  if(H("health","antidoping")) L.push(`<b>Controles antidopaje.</b> Compra solo productos con sello Informed Sport o NSF Certified for Sport. Muchos suplementos llevan sustancias prohibidas que no salen en la etiqueta, y el positivo es tuyo.`);
  if(H("issues","fatiga")||a.energy==="nada") L.push(`<b>Cansancio constante.</b> Pide una analítica completa (hierro, ferritina, vitamina D, B12 y tiroides). El cansancio que no se va no se arregla con un pre-entreno.`);
  if(a.late==="si") L.push(`<b>Cafeína por la tarde.</b> La cafeína sigue en tu cuerpo 6–8 horas. Si te cuesta dormir, corta el café, el té y las bebidas energéticas a partir de las 4 de la tarde.`);
  if(a.sleep==="poco") L.push(`<b>Duermes menos de 6 horas.</b> No hay suplemento que compense eso. Dormir más es lo que más va a mejorar tu físico y tu energía.`);
  return L;
}

};
function baseFor(a){
  const L=[...BASE[a.goal]], H=(k,v)=>Array.isArray(a[k])&&a[k].includes(v);
  if(a.energy==="cuesta"||a.energy==="nada") L.push("Come algo 1–3 h antes de entrenar: un plátano con yogur o una tostada");
  if(Array.isArray(a.injury)&&a.injury.length&&!H("injury","nada")) L.push(a.rehab==="no"?"Para lesionarte menos: haz ejercicios de fuerza para esa zona (mejor con un fisio). Es lo que más previene recaídas, mucho más que cualquier suplemento":"Para lesionarte menos: sube la carga poco a poco, calienta bien y descansa. Ningún suplemento previene lesiones por sí solo");
  return L;
}

/* =========================================================
   VISTAS
   ========================================================= */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fresh=()=>({goal:null,w:70,days:null,cond:[],recov:[],injury:[],why:[],period:[],periodMenor:[],issues:[],health:[],current:[]});
let A=fresh(), cur="goal", libG="all", libQ="", libFrom="cover";
const show=html=>{app.innerHTML=html;window.scrollTo(0,0);};
const visible=()=>Q.filter(q=>!q.when||q.when(A));
const sr=()=>A.sex==="h"?"señor":A.sex==="m"?"señora":"señor@";

function cover(){
  show(`<div class="screen cover">
    <img class="banner" src="${IMG.banner}" alt="Zamudio Coach: entrenamiento y nutrición basado en ciencia y biomecánica">
    <h1>¿Qué <span class="hl">suplementos</span> necesitas?</h1>
    <p class="sub">¿Y si no necesitas ninguno y estás perdiendo el dinero?</p>
    <p class="lead"><b>Te lo explico fácil:</b> responde unas preguntitas rápidas sobre ti, tu entrenamiento, tu alimentación y tu salud, y te digo qué tomar y cuándo tomarlo. Basado en estudios.</p>
    <div class="facts"><span>Tardas menos de 3 minutos</span></div>
    <button class="cta" id="go">¡Vamos al lío!</button>
    <div class="how">
      <div><i>✓</i><span>Lo que te sirve <b>a ti</b>, con tu dosis calculada</span></div>
      <div><i>✓</i><span>Qué tomar si te lesionas, duermes mal, llegas sin energía o tienes molestias con la regla</span></div>
      <div><i>✓</i><span>Qué mirar antes en una analítica</span></div>
      <div><i>✓</i><span>En qué <b>no</b> gastarte el dinero</span></div>
    </div>
    <button class="ghost" id="lib">Ver todos los suplementos y si funcionan</button>
    <p class="legal">Información general basada en estudios científicos. No sustituye a tu médico. Si tienes una enfermedad, tomas medicación o estás embarazada, consúltalo antes.</p>
  </div>`);
  document.getElementById("go").onclick=()=>{A=fresh();cur="goal";quiz();};
  document.getElementById("lib").onclick=()=>{libFrom="cover";library();};
}

function quiz(){
  const V=visible(); let i=V.findIndex(q=>q.id===cur); if(i<0){i=0;cur=V[0].id;}
  const q=V[i], total=V.length, isMulti=q.type==="multi";
  let body="";
  if(q.type==="weight"){
    body=`<div class="weight">
      <div class="wrow"><button type="button" id="wm" aria-label="Restar 1 kg">−</button><div class="wnum" id="wn">${A.w}<small>kg</small></div><button type="button" id="wp" aria-label="Sumar 1 kg">+</button></div>
      <input type="range" id="wr" min="35" max="160" step="1" value="${A.w}" aria-label="Tu peso en kilos">
    </div><button class="cta" id="next">Siguiente</button>`;
  } else {
    const sel=v=>isMulti?(A[q.id]||[]).includes(v):A[q.id]===v;
    body=`<div class="opts ${isMulti?"multi":""}">`+q.opts.map(([v,l,s])=>`<button type="button" class="opt" data-v="${v}" aria-pressed="${sel(v)}"><span>${esc(l)}${s?`<small>${esc(s)}</small>`:""}</span><span class="tick">${sel(v)?"✓":""}</span></button>`).join("")+`</div>`
      +(isMulti?`<button class="cta" id="next" ${(A[q.id]||[]).length?"":"disabled"}>${i===total-1?"Ver mis resultados":"Siguiente"}</button>`:"");
  }
  const greet = i===0
    ? `<div class="greet"><img src="${IMG.face}" alt="Álvaro Zamudio"><div><b>¡Vamos al lío, señor@!</b><span>Contesta con sinceridad para saber los suplementos que necesitas y los que no.</span></div></div>`
    : (q.sec!==V[i-1].sec?`<div class="greet"><img src="${IMG.face}" alt="Álvaro Zamudio"><div><b>${q.sec==="Para terminar"?`¡Última, ${sr()}!`:`Vamos con ${q.sec.toLowerCase()}, ${sr()}`}</b><span>${q.sec==="Tu entreno"?"Para saber qué te ayuda a rendir y recuperar.":q.sec==="Tu alimentación"?"Para ver qué te puede faltar.":q.sec==="Tu salud"?"Esto es lo que más cambia lo que te conviene.":"Y te digo qué necesitas y qué no."}</span></div></div>`:"");
  show(`<div class="screen q">
    <div class="bar"><button class="back" id="back">← Atrás</button><div class="prog"><div style="width:${(i+1)/total*100}%"></div></div><span class="count">${i+1}/${total}</span></div>
    ${greet}
    <div class="secname">${esc(q.sec)}</div>
    <h2>${esc(typeof q.q==="function"?q.q(A):q.q)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
    ${body}
  </div>`);
  document.getElementById("back").onclick=()=>{ if(i===0) cover(); else {cur=V[i-1].id;quiz();} };
  const next=()=>{ const V2=visible(), j=V2.findIndex(x=>x.id===q.id); if(j<V2.length-1){cur=V2[j+1].id;quiz();} else result(); };
  if(q.type==="weight"){
    const upd=v=>{A.w=Math.max(35,Math.min(160,v));document.getElementById("wn").innerHTML=`${A.w}<small>kg</small>`;document.getElementById("wr").value=A.w;};
    document.getElementById("wm").onclick=()=>upd(A.w-1);
    document.getElementById("wp").onclick=()=>upd(A.w+1);
    document.getElementById("wr").oninput=e=>upd(+e.target.value);
    document.getElementById("next").onclick=next;
  } else if(isMulti){
    const nb=document.getElementById("next");
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const v=b.dataset.v; let arr=A[q.id]||[];
      if(v==="nada") arr = arr.includes("nada")?[]:["nada"];
      else { arr=arr.filter(x=>x!=="nada"); arr = arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; }
      A[q.id]=arr;
      app.querySelectorAll(".opt").forEach(o=>{const on=arr.includes(o.dataset.v);o.setAttribute("aria-pressed",on);o.querySelector(".tick").textContent=on?"✓":"";});
      nb.disabled=!arr.length;
    });
    nb.onclick=()=>{ if(!nb.disabled) next(); };
  } else {
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      A[q.id]=b.dataset.v;
      if(q.id==="sex"&&A.sex==="h"){A.period=[];A.periodMenor=[];}
      app.querySelectorAll(".opt").forEach(o=>{const on=o===b;o.setAttribute("aria-pressed",on);o.querySelector(".tick").textContent=on?"✓":"";});
      setTimeout(next,180);
    });
  }
}

/* Veredicto sobre lo que ya toma */
const CURN = Object.fromEntries(Q.find(q=>q.id==="current").opts.map(([v,l])=>[v,l]));
function currentVerdict(a,R){
  const st=id=>R.find(x=>x.id===id);
  return (a.current||[]).filter(v=>v!=="nada").map(v=>{
    if(v==="otros") return {n:CURN[v],k:"meh",t:"Búscalos en «Ver todos los suplementos» para saber si funcionan."};
    let r = v==="preentreno" ? (st("preok")||st("cafeina")) : st(v);
    const s=BY[v==="preentreno"?"preentreno":v];
    if((v==="preentreno"||v==="cafeina")&&(a.coffee==="3+")) return {n:CURN[v],k:"no",t:"Con los cafés que ya tomas tienes cafeína de sobra. Déjalo, o cambia uno de tus cafés por él antes de entrenar."};
    if(v==="preentreno"&&r&&(r.s==="take"||r.s==="opt")) return {n:CURN[v],k:r.s==="take"?"si":"meh",t:"Te puede servir, pero solo si tiene todas las dosis a la vista y la cafeína que te indico. Si es de «mezcla patentada», cámbialo."};
    if(r&&r.s==="take") return {n:CURN[v],k:"si",t:"Sigue con él: te sirve."};
    if(r&&r.s==="test") return {n:CURN[v],k:"test",t:"Solo si la analítica dice que te falta. Si no te la has hecho, pídela antes de seguir."};
    if(r&&r.s==="opt") return {n:CURN[v],k:"meh",t:"Puedes seguir, pero te ayuda poco."};
    if(r&&r.s==="avoid") return {n:CURN[v],k:"no",t:"Déjalo o consúltalo con tu médico. "+r.why};
    if(r&&r.s==="skip") return {n:CURN[v],k:"no",t:"Puedes dejarlo. "+r.why};
    if(s&&(s.g==="D"||s.g==="X")) return {n:CURN[v],k:"no",t:"Déjalo. "+s.para};
    return {n:CURN[v],k:"no",t:"En tu caso no te aporta nada: puedes dejarlo y ahorrarte el dinero."};
  });
}
const VK={si:["Sigue","var(--yellow)","var(--on-yellow)"],test:["Analítica","var(--fg)","var(--on-yellow)"],meh:["Ayuda poco","var(--surface2)","var(--muted)"],no:["Déjalo","var(--red)","var(--on-yellow)"]};

function card(x,kind){
  const s=BY[x.id], dose=x.dose||s.como;
  return `<article class="card ${kind}">
    <div class="top"><h3>${esc(s.n)}</h3><span class="badge b-${s.g}">${GL[s.g]}</span></div>
    <p>${esc(x.why)}</p>
    ${kind!=="avoid"?`<div class="row dose"><b>${kind==="test"?"Si falta":"Cuánto"}</b><span>${esc(dose)}</span></div>`:""}
    ${(kind==="take"||kind==="opt")&&s.elige?`<div class="row"><b>Elige</b><span>${esc(s.elige)}</span></div>`:""}
    ${kind==="take"&&s.ojo?`<div class="row"><b>Ojo</b><span>${esc(s.ojo)}</span></div>`:""}
  </article>`;
}

function result(){
  const R=evaluate(A), by=k=>R.filter(x=>x.s===k), alerts=alertsFor(A);
  const take=by("take"), test=by("test"), opt=by("opt"), avoid=by("avoid"), mine=currentVerdict(A,R);
  const curIds=new Set((A.current||[]).map(v=>v==="preentreno"?"preentreno":v));
  const skips=by("skip").filter(x=>!curIds.has(x.id));
  const sec=(k,title,sub,col,items)=>items.length?`<section class="sec"><h2><span class="sw" style="background:${col}"></span>${title}</h2>${sub?`<p>${sub}</p>`:""}${items.map(x=>card(x,k)).join("")}</section>`:"";
  const optHidden = A.budget==="min" && opt.length;
  show(`<div class="screen">
    <div class="brand"><img src="${IMG.logo}" alt="Logo de Zamudio Coach"><button class="back" id="redo">Repetir test</button></div>
    <div class="greet"><img src="${IMG.face}" alt="Álvaro Zamudio"><div><b>Aquí lo tienes, ${sr()}</b><span>Según tus respuestas. Empieza por lo amarillo.</span></div></div>
    <div class="res-head"><h1>Lo que necesitas <span class="hl">y lo que no</span></h1><p>Objetivo: <b style="color:var(--fg)">${GOALS[A.goal]}</b> · ${A.w} kg</p></div>
    <div class="summary"><div><b>${take.length}</b><span>Tómalo</span></div><div><b>${test.length}</b><span>Analítica</span></div><div><b>${opt.length}</b><span>Opcional</span></div></div>
    ${alerts.map(a=>`<div class="alert">${a}</div>`).join("")}
    ${mine.length?`<section class="sec"><h2><span class="sw" style="background:var(--fg)"></span>Lo que ya tomas</h2><p>Lo que te sirve y lo que no de lo que tomas ahora.</p><div class="nope cur">${mine.map(c=>`<div><b>${esc(c.n)} <i style="background:${VK[c.k][1]};color:${VK[c.k][2]}">${VK[c.k][0]}</i></b><span>${esc(c.t)}</span></div>`).join("")}</div></section>`:""}
    ${sec("take","Tómalo","Funciona y encaja contigo.","var(--yellow)",take)}
    ${!take.length?`<div class="card"><p>En tu caso <b>no necesitas ningún suplemento</b> para empezar. Céntrate en lo que de verdad importa (más abajo).</p></div>`:""}
    ${sec("test","Antes, analítica","Puede que te falte. Pide esto a tu médico y compruébalo antes de gastar dinero.","var(--fg)",test)}
    ${optHidden?`<section class="sec" id="optbox"><h2><span class="sw" style="background:var(--muted)"></span>Opcional</h2><p>Has elegido lo mínimo, así que no te los pongo. Hay ${opt.length} que te podrían ayudar un poco.</p><button class="ghost" id="showopt">Ver los ${opt.length} opcionales</button></section>`
      :sec("opt","Opcional","Ayudan poco o solo en algunos momentos. Solo cuando lo de arriba esté en marcha.","var(--muted)",opt)}
    ${sec("avoid","Cuidado en tu caso","Por lo que me has contado, mejor no, o pregunta antes a tu médico.","var(--red)",avoid)}
    <div class="base"><h2>Lo que de verdad importa</h2><ul>${baseFor(A).map(t=>`<li>${esc(t)}</li>`).join("")}</ul><div class="foot">Sin esto, ningún suplemento funciona. Los suplementos son el último 5 %.</div></div>
    ${skips.length?`<section class="sec"><h2><span class="sw" style="background:var(--red)"></span>No gastes dinero en</h2><div class="nope">${skips.map(x=>{const s=BY[x.id];return `<div><b class="${s.g==="X"?"x":""}">${esc(s.n)}${s.g==="X"?" · peligroso":""}</b><span>${esc(x.why)}</span></div>`}).join("")}</div></section>`:""}
    <div class="me-cta">
      <div class="who"><img src="${IMG.face}" alt=""><h2>¿No tienes claro qué te viene mejor en tu caso?</h2></div>
      <p>Te ayudo con tu entreno y tu alimentación, adaptados a ti. Escríbeme <b>ASESORÍA</b> por privado y lo vemos.</p>
      <a href="${IG}" target="_blank" rel="noopener">Escríbeme en Instagram</a>
    </div>
    <button class="ghost" id="lib">Ver todos los suplementos y si funcionan</button>
    <p class="legal">Información general basada en revisiones y consensos científicos (COI, ISSN, ACSM, EFSA, Cochrane). No sustituye a tu médico ni a un análisis de tu caso.</p>
  </div>`);
  document.getElementById("redo").onclick=()=>{A=fresh();cur="goal";quiz();};
  document.getElementById("lib").onclick=()=>{libFrom="result";library();};
  const so=document.getElementById("showopt");
  if(so) so.onclick=()=>{document.getElementById("optbox").outerHTML=sec("opt","Opcional","Ayudan poco o solo en algunos momentos.","var(--muted)",opt);};
}

function library(){
  const F=[["all","Todos"],["A",GL.A],["B",GL.B],["C",GL.C],["D",GL.D],["X",GL.X]];
  show(`<div class="screen">
    <div class="bar"><button class="back" id="back">← Volver</button></div>
    <div class="res-head"><h1>Todos los <span class="hl">suplementos</span></h1><p>Qué hace cada uno de verdad, según los estudios. ${S.length} en total.</p></div>
    <input class="search" id="ls" type="search" placeholder="Busca: creatina, regla, dormir, tendones…" value="${esc(libQ)}" aria-label="Buscar suplemento">
    <div class="filters">${F.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${libG===v}">${l}</button>`).join("")}</div>
    <div class="sec" id="ll"></div>
  </div>`);
  const draw=()=>{
    const q=libQ.toLowerCase();
    const L=S.filter(s=>(libG==="all"||s.g===libG)&&(!q||(s.n+" "+s.para+" "+(s.ojo||"")).toLowerCase().includes(q)));
    document.getElementById("ll").innerHTML=L.length?L.map(s=>`<article class="card">
      <div class="top"><h3>${esc(s.n)}</h3><span class="badge b-${s.g}">${GL[s.g]}</span></div>
      <p>${esc(s.para)}</p>
      ${s.como?`<div class="row dose"><b>Cuánto</b><span>${esc(s.como)}</span></div>`:""}
      ${s.elige?`<div class="row"><b>Elige</b><span>${esc(s.elige)}</span></div>`:""}
      ${s.ojo?`<div class="row"><b>Ojo</b><span>${esc(s.ojo)}</span></div>`:""}
      <div class="refs">Estudios: ${esc(s.refs)}</div></article>`).join(""):`<p style="color:var(--muted)">No encuentro «${esc(libQ)}». Prueba con otra palabra.</p>`;
  };
  document.getElementById("back").onclick=()=>libFrom==="result"?result():cover();
  document.getElementById("ls").oninput=e=>{libQ=e.target.value;draw();};
  app.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{libG=b.dataset.v;app.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();});
  draw();
}

cover();
</script>
